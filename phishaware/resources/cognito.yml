Resources:
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: phishaware-user-pool-${self:provider.stage}
      UsernameAttributes:
        - email
      UsernameConfiguration:
        CaseSensitive: False
      AutoVerifiedAttributes:
        - email
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_LINK
        EmailMessageByLink: |
          Hello,

          Thank you for registering with PhishAware. Please click the link below to verify your email address:

          {##Click here##}

          If you did not register for an account, please ignore this email.

          Regards,
          PhishAware Team
        EmailSubjectByLink: Phishaware - Email Verification Link
      Schema:
        - AttributeDataType: String
          DeveloperOnlyAttribute: False
          Mutable: true
          Name: role
  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: phishaware-user-pool-client-${self:provider.stage}
      UserPoolId:
        Ref: CognitoUserPool
      ExplicitAuthFlows:
        - ADMIN_NO_SRP_AUTH
      GenerateSecret: false
  CognitoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId:
        Ref: CognitoUserPool
      Domain: phishaware-${self:provider.stage}
