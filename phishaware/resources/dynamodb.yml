Resources:
  TestTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: user-table-${self:service}-${self:provider.environment.env}
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
